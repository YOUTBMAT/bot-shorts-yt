name: Publicar Shorts Diario

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 18 * * *' # Executa diariamente às 15:00 no horário de Brasília (18:00 UTC)

jobs:
  executar-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar ambiente Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 3. Instalar FFmpeg
        uses: federicocarboni/setup-ffmpeg@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Instalar ImageMagick, Fontes e Corrigir Policy
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu ttf-mscorefonts-installer
          # Libera permissoes de leitura e escrita para texto no ImageMagick
          sudo sed -i 's/<policy domain="coder" rights="none" pattern="PDF" \/>/<policy domain="coder" rights="read | write" pattern="PDF" \/>/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read | write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true

      - name: 5. Cache do modelo de transcricao (faster-whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Chave baseada no SO do runner + versao do Python + hash do
          # requirements.txt. O conteudo do cache (pesos/tokenizer do modelo
          # HF) e binario-agnostico e nao muda com a versao do Python -- mas
          # incluir "python-3.14" aqui documenta explicitamente a mudanca de
          # ambiente (3.10 -> 3.14) e garante que um eventual downgrade/
          # rollback de Python nao reaproveite por engano um cache calculado
          # sob outra versao do toolchain. Tambem muda automaticamente
          # sempre que uma dependencia (ex: faster-whisper) for atualizada,
          # sem depender de alguem lembrar de bumpar um "-v1" manual. Como o
          # tamanho do modelo (WHISPER_MODEL_SIZE) esta fixo no codigo e nao
          # no requirements.txt, uma troca de modelo por si so nao invalida
          # o cache automaticamente — nesse caso, o cache antigo fica orfao
          # (sem problema: o download simplesmente ignora o cache e baixa o
          # modelo novo por fora dele).
          key: ${{ runner.os }}-python-3.14-whisper-${{ hashFiles('requirements.txt') }}

      - name: 6. Instalar bibliotecas Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: 7. Testar o projeto
        run: python -m unittest discover -s tests -v

      - name: Preparar diretório do cache Pexels
        run: mkdir -p cache/pexels

      - name: 8. Cache da biblioteca de mídia Pexels
        uses: actions/cache@v4
        with:
          path: cache/pexels
          key: ${{ runner.os }}-python-3.14-pexels-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-python-3.14-pexels-${{ hashFiles('requirements.txt') }}-

      - name: 9. Executar o Bot Automatico
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Opcional: sem essa secret configurada, este provedor simplesmente
          # nao entra na fila de TTS -- ver _provedores_tts_configurados().
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Fallback legado: continua funcionando exatamente como antes.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          # Opcional: sem essa secret configurada, o bot funciona
          # normalmente usando so a biblioteca local (assets/videos/)
          # como antes -- ver _criar_media_manager() em bot_main.py.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          python bot_main.py

      - name: 10. Persistir estado de publicação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for path in media_history.json estado_publicacao.json; do
            if [ -e "$path" ]; then
              git add -A -f -- "$path"
            elif git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -u -- "$path"
            fi
          done

          if ! git diff --cached --quiet -- media_history.json estado_publicacao.json; then
            git commit -m "Persist bot publication state"
            git push
          else
            echo "Nenhuma mudança nos arquivos de estado."
          fi
