name: Publicar Shorts Diario

on:
  schedule:
    # Roda diariamente às 18:00 UTC (15:00 no horário de Brasília)
    - cron: '0 18 * * *'
  workflow_dispatch: 

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar codigo do repositorio
      uses: actions/checkout@v3

    - name: 2. Configurar ambiente Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. Instalar FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v2

    - name: 4. Instalar ImageMagick e Fontes (Corrige TextClip)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick fonts-dejavu
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml

    - name: 5. Instalar bibliotecas Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 6. Executar o Bot Automatico
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      run: python bot_main.py